[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "london"
optimizer = true
optimizer_runs = 500
via_ir = false
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }]
# fork tests need the cancun profile below: FOUNDRY_PROFILE=fork forge test
no_match_path = "test/fork/*"

[rpc_endpoints]
mezo_testnet = "https://rpc.test.mezo.org"
mezo_mainnet = "https://mezo.drpc.org"

[etherscan]
mezo_testnet = { key = "verify", url = "https://api.explorer.test.mezo.org/api", chain = 31611 }

# Mezo's own contracts use post-London opcodes (PUSH0, TSTORE), so fork tests execute on cancun.
# Flywheel itself is still compiled for london in the default profile, as Mezo's docs recommend.
[profile.fork]
evm_version = "cancun"
match_path = "test/fork/*"
no_match_path = "test/__none__/*"
